# MyMoneyWent — Multi-tenant personal finance bot
#
# Runtime deps stay in requirements.txt for Railway nixpacks compatibility.
# Dev tooling + project metadata lives here.
#
# Install dev environment:
#     pip install -e ".[dev]"
#     pre-commit install
#
# See: docs/operations/development-workflow.md

[project]
name = "mymoneywent"
version = "0.0.1"
description = "Multi-tenant personal finance bot — Tiền Về Nơi Đâu (VN) / My Money Went (Global)"
requires-python = ">=3.11"
authors = [{name = "Ngoc-Anh Mai", email = "2maingocanh@gmail.com"}]
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = [
    # Pinned to pre-commit hook versions so local `black/ruff/mypy` and
    # `pre-commit run` agree on formatting/lint output. CI uses pre-commit
    # too; drift here causes false-positive "would reformat" locally.
    "ruff==0.4.10",
    "black==24.4.2",
    "mypy==1.10.0",
    "import-linter>=2.5",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "alembic>=1.13.0",
    "testcontainers>=4.7.0",   # postgres module ships in base in 4.x (no extra)
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "markets*", "handlers*", "i18n*"]
exclude = ["tests*", "docs*", "scripts*", "migrations*"]

# ─────────────────────────────────────────────────────────────────────
# Ruff — lint + import sort. Legacy code excluded until W0.6 moves it.
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # Legacy single-tenant code — will be moved/cleaned in W0.6
    "config.py",
    "main.py",
    "sheets.py",
    "telegram_api.py",
    "handlers/allocation.py",
    "handlers/email_parser.py",
    "handlers/manage.py",
    "handlers/reports.py",
    "handlers/sepay.py",
    "handlers/transaction.py",
    "google_apps_script.js",
    "setup.sh",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line length — black handles
    "S101",  # assert used — common in tests
]

[tool.ruff.lint.per-file-ignores]
"scripts/build-dashboard.py" = ["N999", "S603", "S607"]
"scripts/sync-tracker-from-gh.py" = ["N999", "S603", "S607"]
"tests/**/*.py" = ["S101", "S603", "S607", "S106"]  # asserts + subprocess + fake tokens ok in tests
"tools/autopilot/*.py" = ["S603", "S607"]  # orchestrator wraps trusted CLIs (git/codex/claude)
"scripts/work_state/signal_collectors/git.py" = ["S603", "S607"]  # git CLI calls with controlled args
"scripts/work_state/signal_collectors/github.py" = ["S603", "S607"]  # gh CLI calls with controlled args
"scripts/work_state/signal_collectors/ci.py" = ["S603", "S607"]  # gh CLI calls with controlled args
"scripts/work_state/signal_collectors/railway.py" = ["S310"]  # Railway API URL is hardcoded constant
# scripts/autopilot_*.py mirrors tools/autopilot/* — orchestrator scripts
# wrapping trusted CLIs (git, codex, claude, gh). S110 in manual_automators
# is intentional best-effort fallthrough on notifier failures.
"scripts/autopilot_agent.py" = ["S603", "S607"]
"scripts/autopilot_manual_automators.py" = ["S603", "S607", "S110"]
"scripts/autopilot_runner.py" = ["S603", "S607", "S310"]  # urllib used for ops webhook notifier

# ─────────────────────────────────────────────────────────────────────
# Black — formatter
# ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
# extend-exclude only applies when black walks the dir tree itself.
# pre-commit passes file paths explicitly to the hook, which bypasses
# extend-exclude. force-exclude DOES apply to explicit paths — required
# so legacy files don't get reformatted on CI's `pre-commit run --all-files`.
extend-exclude = '''
/(
    config\.py
  | main\.py
  | sheets\.py
  | telegram_api\.py
  | handlers/(allocation|email_parser|manage|reports|sepay|transaction)\.py
)
'''
force-exclude = '''
/(
    config\.py
  | main\.py
  | sheets\.py
  | telegram_api\.py
  | handlers/(allocation|email_parser|manage|reports|sepay|transaction)\.py
)
'''

# ─────────────────────────────────────────────────────────────────────
# Mypy — strict on new code paths (core/, markets/, tests/)
# Legacy excluded; will be typed when migrated in W0.6.
# ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
files = ["core", "markets", "i18n", "tests"]
ignore_missing_imports = true

# tools/autopilot is the orchestrator; pragmatic-typed per
# autopilot-implementation-plan.md v0.1.6 §1.1 ("mypy strict NOT scoped to
# tools/"). When the orchestrator is imported transitively from strict-mode
# test files we relax checks so existing untyped helpers do not get flagged.
[[tool.mypy.overrides]]
module = "tools.autopilot.*"
ignore_errors = true

# Legacy single-tenant modules — transitively imported by strict-mode tests
# (e.g. tests/integration/test_app_startup.py imports `main`). Slated for
# strangler-fig removal in F02; relaxing checks here mirrors the
# tools/autopilot pattern above so existing untyped legacy helpers aren't
# flagged when imported by typed code.
[[tool.mypy.overrides]]
module = ["main", "config", "sheets", "telegram_api", "handlers.*"]
ignore_errors = true

# ─────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
