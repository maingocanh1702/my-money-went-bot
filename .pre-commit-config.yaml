# Pre-commit hooks for MyMoneyWent.
# Run on staged files locally before commit; CI re-runs all files on PR.
#
# Setup:
#     pip install -e ".[dev]"
#     pre-commit install
#
# Manual run:
#     pre-commit run --all-files
#
# See: docs/operations/development-workflow.md §3

default_language_version:
  python: python3

repos:
  # ── Ruff (lint + import sort, NO format — black owns format) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]

  # ── Black (formatter, single source of truth for code style) ──
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.4.2
    hooks:
      - id: black

  # ── Mypy (strict type check on new code) ──
  # additional_dependencies: include pytest + libs whose stubs are needed
  # so mypy under the isolated pre-commit env sees the same types as our
  # local `.venv` mypy run. Without these, `pytest.fixture` / `parametrize`
  # decorators report "Untyped decorator" errors.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^(core|markets|tests)/
        # --config-file lets pyproject [[tool.mypy.overrides]] apply so
        # tools.autopilot.* (orchestrator) stays pragmatic-typed when pulled
        # in transitively from strict-mode test files. Plan v0.1.6 §1.1.
        args: [--strict, --ignore-missing-imports, --config-file=pyproject.toml]
        additional_dependencies:
          - pytest>=8.0.0
          - pytest-asyncio>=0.23.0
          - structlog>=24.4.0
          - sentry-sdk[fastapi]>=2.18.0
          - fastapi>=0.136.1
          - httpx>=0.28.1
          - asyncpg>=0.30.0
          - psycopg[binary]>=3.2.0

  # ── detect-secrets (block accidental secret commits) ──
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.lock|
            docs/.*|
            __pycache__/.*|
            \.secrets\.baseline
          )$

  # ── import-linter (enforce ADR-0001 boundary: core ↛ markets) ──
  # W0.2: bumped to v2.5 — upstream renamed hook id from `lint-imports` to
  # `import-linter` somewhere between v2.0 and v2.5. CLI command is still
  # `lint-imports` (see CI workflow + tests/test_import_boundary.py).
  - repo: https://github.com/seddonym/import-linter
    rev: v2.5
    hooks:
      - id: import-linter
