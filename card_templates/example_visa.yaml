# Example Visa — Cashback Template (SAMPLE, not a real card)
#
# A worked second example next to cake_freedom.yaml, showing the parts that
# template does not use: a per-rule `rate` (each MCC earns its own %), a
# `calendar_month` cap period, no activation gate and no per-tx tiers.
#
# ⚠️ The rates and caps below are invented. Copy this file, rename card_id,
# and fill in the real numbers from YOUR card's terms before seeding it.

card_id: example_visa
card_name: "Example Visa"
bank: "Example Bank"
version: "1.0"
description: "Sample template: 1-5% hoàn theo danh mục MCC, cap theo tháng dương lịch"

config:
  cashback_rate: 0.01           # base rate: dùng khi rule không có `rate` riêng
  min_eligible_spend: 0         # không cổng kích hoạt
  cap_period: calendar_month
  alert_pct: 0.80

tier_set: ""                    # không per-tx cap tiers
tiers: []

rules:
  - mcc: "5811"
    name: "Quán ăn nhỏ"
    emoji: "🍜"
    monthly_cap: 500000
    rate: 0.03
    daily_limit: 0

  - mcc: "5812"
    name: "Nhà hàng"
    emoji: "🍽️"
    monthly_cap: 500000
    rate: 0.03
    daily_limit: 0

  - mcc: "5813"
    name: "Bar / Lounge"
    emoji: "🍸"
    monthly_cap: 500000
    rate: 0.03
    daily_limit: 0

  - mcc: "5814"
    name: "Fast food"
    emoji: "🍔"
    monthly_cap: 500000
    rate: 0.03
    daily_limit: 0

  - mcc: "5411"
    name: "Siêu thị"
    emoji: "🛒"
    monthly_cap: 300000
    rate: 0.02
    daily_limit: 0

  - mcc: "5499"
    name: "Cửa hàng tiện lợi"
    emoji: "🏪"
    monthly_cap: 300000
    rate: 0.02
    daily_limit: 0

  - mcc: "5262"
    name: "Mua sắm online"
    emoji: "🛍"
    monthly_cap: 300000
    rate: 0.02
    daily_limit: 0

  - mcc: "4899"
    name: "Giải trí"
    emoji: "🎬"
    monthly_cap: 200000
    rate: 0.05
    daily_limit: 0

  - mcc: "5815"
    name: "Digital media"
