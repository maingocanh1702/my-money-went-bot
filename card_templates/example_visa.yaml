  - mcc: "4722"
    name: "Du lịch"
    emoji: "✈️"
    monthly_cap: 500000
    rate: 0.05
    daily_limit: 0

patterns:
  "5811": ["PHUC LONG", "HIGHLANDS", "STARBUCKS", "CAFE", "TRA SUA", "KATINAT"]
  "5812": ["KICHI", "GOGI", "GOLDEN GATE", "LOTTERIA", "KFC", "PIZZA", "JOLLIBEE"]
  "5813": ["BAR", "LOUNGE", "PUB"]
  "5814": ["MCDONALDS", "BURGER KING", "DOMINOS"]
  "5411": ["WINMART", "BACHHOAXANH", "BHX", "LOTTE", "COOPMART", "EMART"]
  "5499": ["CIRCLE K", "GS25", "MINISTOP", "FAMILY MART", "7ELEVEN"]
  "5262": ["SHOPEE", "LAZADA", "TIKI", "SENDO"]
