# Alembic config for MyMoneyWent.
#
# Connection URL resolved at runtime via DATABASE_URL env var
# (see migrations/env.py). This file keeps tooling defaults only.
#
# Usage:
#   DATABASE_URL=postgresql://... alembic upgrade head
#   DATABASE_URL=postgresql://... alembic downgrade base
#   DATABASE_URL=postgresql://... alembic revision -m "..."

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Use UTC timestamps in revision filenames
timezone = UTC
# Filenames: 0002_add_column_x.py, 0003_..., etc.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Auto-format generated migrations
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
