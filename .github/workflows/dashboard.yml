name: Rebuild dashboard

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'infra/**'
      - 'chore/**'
      - 'fix/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'auto-rebuild') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all branches + tags
        run: git fetch --all --prune --tags

      - name: Check if build script is on main
        id: check
        run: |
          if [[ -f scripts/build-dashboard.py ]]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::scripts/build-dashboard.py not on main yet — workflow no-ops until PR merges."
          fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Build dashboard
        if: steps.check.outputs.ready == 'true'
        run: python scripts/build-dashboard.py

      - name: Commit if outputs changed
        if: steps.check.outputs.ready == 'true'
        run: |
          if [[ -n "$(git status --porcelain docs/dashboard.html docs/dashboard.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/dashboard.html docs/dashboard.md
            trigger="${GITHUB_EVENT_NAME}"
            if [[ "$trigger" == "push" ]]; then
              trigger="${trigger} from ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7})"
            fi
            git commit -m "chore(dashboard): auto-rebuild — ${trigger}"
            git push origin main
            echo "Pushed dashboard rebuild commit."
          else
            echo "Dashboard outputs already in sync — no commit needed."
          fi
