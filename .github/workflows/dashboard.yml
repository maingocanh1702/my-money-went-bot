name: Rebuild dashboard

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened, synchronize, ready_for_review, converted_to_draft, review_requested, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '0 6 * * *'   # daily 6 AM UTC (1 PM Vietnam time), down from hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-rebuild
  cancel-in-progress: true

env:
  CACHE_SCHEMA_VERSION: v1

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
      || github.event_name == 'pull_request_review'
      || (github.event_name == 'workflow_run'
          && !contains(github.event.workflow_run.head_commit.message, 'auto-rebuild'))
      || (github.event_name == 'push'
          && !contains(github.event.head_commit.message, 'auto-rebuild'))
    steps:
      # Pinned to full commit SHA (not floating tags) per supply-chain best practice.
      # Same pin as ci.yml — keep in sync via Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all branches + tags
        run: git fetch --all --prune --tags

      - name: Restore dashboard-engine state cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.0
        with:
          path: tools/dashboard-engine/.state/
          key: dashboard-state-v${{ env.CACHE_SCHEMA_VERSION }}-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.sha) || 'main' }}
          restore-keys: |
            dashboard-state-v${{ env.CACHE_SCHEMA_VERSION }}-main
            dashboard-state-v${{ env.CACHE_SCHEMA_VERSION }}-

      - name: Check if build script is on main
        id: check
        run: |
          if [[ -f tools/dashboard-engine/build_dashboard.py ]]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::tools/dashboard-engine/build_dashboard.py not on main yet — workflow no-ops until PR merges."
          fi

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Build dashboard
        if: steps.check.outputs.ready == 'true'
        run: python tools/dashboard-engine/build_dashboard.py

      - name: Commit if outputs changed
        if: steps.check.outputs.ready == 'true'
        run: |
          if [[ -n "$(git status --porcelain docs/dashboard.html docs/dashboard.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/dashboard.html docs/dashboard.md
            trigger="${GITHUB_EVENT_NAME}"
            if [[ "$trigger" == "push" ]]; then
              trigger="${trigger} from ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7})"
            fi
            git commit -m "chore(dashboard): auto-rebuild — ${trigger}"
            git push origin main
            echo "Pushed dashboard rebuild commit."
          else
            echo "Dashboard outputs already in sync — no commit needed."
          fi
