name: Publish wiki

# The published wiki lives in a separate git repository, so docs/wiki/ and the
# pages people actually read drift apart silently unless something syncs them.
# That already happened once: the wiki documented environment variables that no
# longer existed and omitted a mandatory one, so anyone following it deployed a
# bot that refused to start.

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Sync docs/wiki to the wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone the wiki
        run: |
          git clone --quiet \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Copy pages
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md wiki/

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches docs/wiki — nothing to publish."
            exit 0
          fi
          git commit -m "docs: publish docs/wiki from ${GITHUB_SHA::7}"
          git push
