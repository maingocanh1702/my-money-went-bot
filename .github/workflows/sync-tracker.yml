name: Sync tracker on PR merge

# Auto-flip tracker row status ⬜/🟡/🟠/🟢/❌ → ✅ when a PR is merged on GitHub.
# Match: PR.headRefName == tracker row Branch cell.
# Idempotent: rows already ✅ or ⏸️ are skipped.
#
# Chain: this commit on main → triggers dashboard.yml → dashboard rebuilds with
# the new ✅ status reflected in metrics + phase board.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (preview changes, do not commit)'
        type: boolean
        default: false

permissions:
  contents: write          # commit tracker change
  pull-requests: read      # read merged PRs

concurrency:
  group: sync-tracker
  cancel-in-progress: false

jobs:
  sync:
    # Only run for actually-merged PRs (not just closed-without-merge),
    # or on manual workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync tracker from GitHub merge state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python scripts/sync-tracker-from-gh.py --dry-run
          else
            python scripts/sync-tracker-from-gh.py
          fi

      - name: Commit if tracker changed
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain docs/implementation-tracker.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/implementation-tracker.md
            git commit -m "chore(tracker): auto-flip merged PR rows from GitHub"
            git push origin main
            echo "Tracker updated. dashboard.yml workflow will fire next on this push."
          else
            echo "Tracker already in sync — no commit needed."
          fi
