# Scheduled triggers for the production bot on Railway.
# This is the CANONICAL cron for production (crontab.txt is the VPS reference).
#
# Times are UTC (ICT = UTC+7). CRON_SECRET lives in GitHub repo secrets and
# must match the Railway env var of the same name. It is sent as an
# "Authorization: Bearer" header — never in the URL, which gets logged.
#
# NOTE: GitHub pauses scheduled workflows after ~60 days without repo
# activity — any push re-enables them.

name: Scheduled triggers

on:
  schedule:
    - cron: "0 2 1 * *"      # monthly-allocation  — 09:00 ICT ngày 1
    - cron: "0 3 1 * *"      # auto-alloc-fallback — 10:00 ICT ngày 1
    - cron: "0 13 * * 0"     # weekly              — 20:00 ICT Chủ nhật
    - cron: "0 14 28-31 * *" # monthly-report      — 21:00 ICT (handler tự check ngày cuối tháng)
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Trigger endpoint to fire"
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly-report
          - monthly-allocation
          - auto-alloc-fallback
          - daily-recap

env:
  # REPLACE THIS with your own deployment URL, and add a CRON_SECRET repository
  # secret (Settings → Secrets and variables → Actions). Until both are done this
  # workflow runs on schedule and posts to nobody — no weekly recap, no monthly
  # report, no allocation prompt, and no error to tell you why.
  BOT_URL: https://YOUR-APP.up.railway.app

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Upstream ships BOT_URL as a placeholder, so on this repository every
      # scheduled run posted to a host that does not resolve and went red —
      # about seven failed runs a month and a permanently red Actions tab.
      # Fork it, set BOT_URL, and the schedule starts working.
      - name: Skip while BOT_URL is still the placeholder
        id: guard
        run: |
          if [ "${BOT_URL#https://YOUR-APP}" != "$BOT_URL" ]; then
            echo "BOT_URL is unset (still the template placeholder) — nothing to fire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve endpoint
        id: ep
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ep="${{ inputs.endpoint }}"
          else
            case "${{ github.event.schedule }}" in
              "0 2 1 * *")      ep="monthly-allocation" ;;
              "0 3 1 * *")      ep="auto-alloc-fallback" ;;
              "0 13 * * 0")     ep="weekly" ;;
              "0 14 28-31 * *") ep="monthly-report" ;;
              *) echo "unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          echo "endpoint=$ep" >> "$GITHUB_OUTPUT"
          echo "Firing: $ep"

      - name: Fire trigger
        if: steps.guard.outputs.skip == 'false'
        run: |
          # The secret goes in a header, not the query string: a URL is copied
          # into the runner log, the bot host's access log, and every proxy in
          # between, and CRON_SECRET is long-lived.
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BOT_URL/trigger/${{ steps.ep.outputs.endpoint }}")
          echo "HTTP $code"
          cat /tmp/resp.txt
          [ "$code" = "200" ]
