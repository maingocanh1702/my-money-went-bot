name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The version comes from .python-version so CI, the deploy and a local
      # checkout cannot drift apart silently.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: No personal data in the repository
        run: python3 scripts/check_no_personal_data.py

      # Undefined names, redefinitions and syntax errors only. Audit finding
      # F-08 was a NameError that sat in production for weeks because the
      # surrounding except swallowed it; this rule set catches that class in
      # well under a second. Style rules are deliberately not enforced here.
      - name: Static errors (ruff)
        run: ruff check --select E9,F63,F7,F82 --no-cache .

      - name: Run tests
        run: pytest tests/ -v --tb=short
