name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: No personal data in the repository
        run: python3 scripts/check_no_personal_data.py

      # Undefined names, redefinitions and syntax errors only. Audit finding
      # F-08 was a NameError that sat in production for weeks because the
      # surrounding except swallowed it; this rule set catches that class in
      # well under a second. Style rules are deliberately not enforced here.
      - name: Static errors (ruff)
        run: |
          pip install ruff==0.15.14
          ruff check --select E9,F63,F7,F82 --no-cache .

      - name: Run tests
        run: pytest tests/ -v --tb=short
