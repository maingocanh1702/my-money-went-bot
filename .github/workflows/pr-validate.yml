name: pr-validate
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
jobs:
  validate:
    # Skip entire workflow for Dependabot — bot PRs use branch pattern
    # `dependabot/*` and don't write Linear refs in PR body. Manual review
    # via GitHub UI still gates merge (Codex/CI/founder review unaffected).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Branch naming
        env:
          BRANCH: "${{ github.head_ref }}"
        run: |
          # Exemptions cover Wave-prefixed work, hotfixes, releases, plus the
          # plan-scoped multi-PR series (fix/*, feat/c1-*, chore/*) used by
          # security-driven work that predates Linear MYM issue assignment.
          case "$BRANCH" in
            W0.*|Wave-*|hotfix/*|release/*|fix/*|feat/c1-*|chore/*) exit 0 ;;
          esac
          if ! echo "$BRANCH" | grep -Eq '^[a-z0-9-]+/MYM-[0-9]+-[a-zA-Z0-9-]+$'; then
            echo "::error::Branch '$BRANCH' must match <dev>/MYM-<id>-<slug> (slug may contain a-zA-Z0-9-)"
            exit 1
          fi
      - name: PR body magic word
        env:
          PR_BODY: "${{ github.event.pull_request.body }}"
        run: |
          if echo "$PR_BODY" | grep -Eq '(Closes|Fixes|Ref) MYM-[0-9]+'; then exit 0; fi
          if echo "$PR_BODY" | grep -q 'Linear: N/A'; then exit 0; fi
          echo "::error::PR body missing 'Closes/Fixes/Ref MYM-NNN' or 'Linear: N/A'"
          exit 1
