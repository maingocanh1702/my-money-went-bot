line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP"]
# Ignore some noisy rules for this codebase
ignore = [
    "E401",   # multiple imports on one line — existing style in handlers
    "E501",   # line-too-long — handled by line-length but many existing lines
    "E701",   # multiple statements on one line — existing dispatch table style
    "E741",   # ambiguous variable name (e, l, etc.)
    "F541",   # f-string without placeholders — existing code style
    "I001",   # import sorting — existing codebase has unsorted imports throughout
    "UP006",  # Use tuple instead of Tuple — existing type hints
    "UP007",  # Use X | Y for union types (needs Python 3.10+ syntax everywhere)
    "UP017",  # Use datetime.UTC — existing code uses timezone.utc
    "UP035",  # typing.Tuple deprecated — paired with UP006
]

[lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F841"]  # tests: allow unused imports/vars + late imports
